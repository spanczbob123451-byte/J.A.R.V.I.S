<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURA">
  <meta name="description" content="AURA — Advanced Utility & Response Assistant">
  <link rel="manifest" href="manifest.json">
  <title>A.U.R.A.</title>
  <style>
    :root{--bg:#05070a;--panel:#0b1017;--panel2:#101720;--line:#1c2935;--text:#e7edf2;--muted:#82909d;--accent:#66d9ff;--accent2:#b7f3ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#122331 0,#05070a 48%);color:var(--text)}
    body{display:flex;justify-content:center}.app{width:min(900px,100%);min-height:100vh;display:flex;flex-direction:column}
    header{padding:22px 18px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(5,7,10,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:12px}.orb{width:42px;height:42px;border:1px solid #5bcfff;border-radius:50%;box-shadow:0 0 18px #37caff66,inset 0 0 14px #37caff33;position:relative}
    .orb:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #b9f3ff88}.title{font-weight:800;letter-spacing:2px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
    .status{font-size:11px;color:#82e8a8;letter-spacing:1px}.main{flex:1;padding:18px 14px 110px}.welcome{text-align:center;padding:42px 16px 28px}
    .welcome h1{font-size:42px;margin:0 0 8px;letter-spacing:6px}.welcome p{margin:0;color:var(--muted)}
    .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chip{background:var(--panel);border:1px solid var(--line);color:#b9c6cf;border-radius:999px;padding:8px 11px;font-size:12px}
    #chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:86%;padding:12px 14px;border-radius:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
    .aura{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.user{align-self:flex-end;background:#123244;border:1px solid #1e566d}
    .time{display:block;font-size:9px;color:var(--muted);margin-top:5px}.inputbar{position:fixed;bottom:0;left:0;right:0;padding:10px;display:flex;justify-content:center;background:linear-gradient(transparent,#05070a 22%);z-index:10}
    .inputwrap{width:min(900px,100%);display:flex;gap:8px;background:rgba(11,16,23,.96);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 -8px 35px #0008}
    input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:10px}.send{border:0;border-radius:11px;background:#b7f3ff;color:#071017;font-weight:800;padding:0 17px}
    button{font:inherit;cursor:pointer}.typing{color:var(--muted);font-size:12px;padding:0 4px}.result a{color:var(--accent2)}
    @media(max-width:500px){.welcome h1{font-size:34px}.msg{max-width:92%}.status{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="orb"></div><div><div class="title">A.U.R.A.</div><div class="sub">Advanced Utility & Response Assistant</div></div></div>
    <div class="status">● ONLINE</div>
  </header>
  <main class="main">
    <section class="welcome" id="welcome">
      <h1>AURA</h1>
      <p>System online. Wpisz komendę.</p>
      <div class="chips">
        <button class="chip" onclick="quick('która jest godzina')">godzina</button>
        <button class="chip" onclick="quick('jaka jest data')">data</button>
        <button class="chip" onclick="quick('oblicz 125 * 8')">kalkulator</button>
        <button class="chip" onclick="quick('pomoc')">komendy</button>
      </div>
    </section>
    <div id="chat"></div>
  </main>
  <div class="inputbar"><div class="inputwrap"><input id="input" autocomplete="off" placeholder="Wpisz komendę dla AURY..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">WYŚLIJ</button></div></div>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), welcome=document.getElementById('welcome');

function addMsg(text, who='aura', html=false){
  welcome.style.display='none';
  const d=document.createElement('div'); d.className='msg '+who;
  if(html)d.innerHTML=text; else d.textContent=text;
  const t=document.createElement('span'); t.className='time'; t.textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  d.appendChild(t); chat.appendChild(d); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function quick(t){input.value=t;send()}
function normalize(s){return s.toLowerCase().trim().replace(/\s+/g,' ')}

function math(q){
  let e=q;
  ['oblicz','policz','ile to jest','ile to','wynosi'].forEach(x=>e=e.replaceAll(x,' '));
  e=e.replaceAll('razy','*').replaceAll(' plus ','+').replaceAll(' minus ','-')
    .replaceAll('podzielić przez','/').replaceAll('podzielic przez','/')
    .replaceAll('do potęgi','**').replaceAll('do potegi','**').replaceAll('×','*').replaceAll('÷','/');
  e=e.replace(/[^0-9+\-*/().%\s]/g,'').trim();
  if(!e || !/\d/.test(e) || !/\d\s*[+\-*/]\s*\d/.test(e)) return null;
  if(!/^(?:[\d\s()+\-*/%.]+|\*\*)+$/.test(e)) return null;
  try{
    if(!/^[\d\s()+\-*/%.]+$/.test(e.replaceAll('**',''))) return null;
    let v=Function('"use strict";return ('+e+')')();
    if(!Number.isFinite(v)) return null;
    return Number.isInteger(v)?`Wynik to ${v}`:`Wynik to ${Number(v.toFixed(6))}`;
  }catch{return null}
}

async function wiki(q){
  let topic=q.replace(/^(powiedz mi|co to jest|co to|kim jest|kto to jest|kto to|jaka jest|jaki jest|jakie jest)\s+/,'').trim();
  if(!topic)return null;
  try{
    const url='https://pl.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topic);
    const r=await fetch(url); if(!r.ok)return null; const d=await r.json();
    return d.extract || null;
  }catch{return null}
}

async function weather(q){
  if(!q.includes('pogoda'))return null;
  let city='Warszawa', m=q.match(/pogoda(?:\s+w)?\s+(.+)/);
  if(m) city=m[1].replace(/[?.!,]+$/,'').trim()||city;
  try{
    const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=pl&format=json');
    const gd=await g.json(); if(!gd.results?.length)return null;
    const x=gd.results[0];
    const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${x.latitude}&longitude=${x.longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`);
    const d=await w.json(), c=d.current;
    const codes={0:'bezchmurnie',1:'głównie bezchmurnie',2:'częściowe zachmurzenie',3:'pochmurnie',45:'mgła',48:'mgła osadzająca szadź',51:'lekka mżawka',53:'mżawka',55:'mocna mżawka',61:'lekki deszcz',63:'deszcz',65:'mocny deszcz',71:'lekki śnieg',73:'śnieg',75:'mocny śnieg',80:'przelotny deszcz',81:'przelotny deszcz',82:'ulewa',95:'burza'};
    return `Pogoda dla ${x.name}: ${c.temperature_2m}°C, odczuwalna ${c.apparent_temperature}°C, ${codes[c.weather_code]||'warunki zmienne'}, wiatr ${c.wind_speed_10m} km/h`;
  }catch{return null}
}

async function handle(q){
  if(!q)return;
  if(/^(do widzenia|wyłącz się|wylacz sie|zakończ|zakoncz)/.test(q)){addMsg('System AURA przechodzi w tryb czuwania. Do widzenia.'); return}
  if(/(pomoc|komendy|co potrafisz|co umiesz)/.test(q)){addMsg('Mogę podać godzinę i datę, liczyć, sprawdzić pogodę, wyszukać informacje w Wikipedii oraz otworzyć Google, YouTube lub notatki.');return}
  if(/(kim jesteś|kim jestes|jak masz na imię|jak masz na imie)/.test(q)){addMsg('Jestem AURA. Twój asystent w wersji webowej. System bez mikrofonu, działa na telefonie i komputerze.');return}
  if(/^(cześć|czesc|hej|siema|witaj)/.test(q)){addMsg('Cześć. System online. Słucham.');return}
  if(q.includes('godzina')){addMsg('Aktualna godzina to '+new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}));return}
  if(q.includes('data')||q.includes('jaki dzień')||q.includes('jaki dzien')){addMsg('Dzisiaj jest '+new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'}));return}
  const w=await weather(q); if(w){addMsg(w);return}
  const m=math(q); if(m){addMsg(m);return}
  if(q.includes('otwórz youtube')||q.includes('otworz youtube')){window.open('https://www.youtube.com','_blank');addMsg('Otwieram YouTube.');return}
  if(q.includes('otwórz google')||q.includes('otworz google')||q.includes('otwórz przeglądarkę')||q.includes('otworz przegladarke')){window.open('https://www.google.com','_blank');addMsg('Otwieram Google.');return}
  if(q.includes('notatnik')){addMsg('Na telefonie mogę otworzyć stronę z prostym notatnikiem. <a href="notatnik.html" style="color:#b7f3ff">Otwórz notatnik</a>', 'aura', true);return}
  addMsg('Szukam informacji…');
  const result=await wiki(q);
  if(result){addMsg(result);return}
  addMsg('Nie znalazłem pewnej odpowiedzi. Możesz spróbować inaczej albo wpisać „otwórz Google”.');
}

async function send(){
  const q=normalize(input.value); if(!q)return;
  input.value=''; addMsg(q,'user'); await handle(q);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
