<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>AURA Notatnik</title><style>body{margin:0;background:#05070a;color:#e7edf2;font-family:system-ui;padding:18px}textarea{width:100%;height:75vh;box-sizing:border-box;background:#0b1017;color:#e7edf2;border:1px solid #1c2935;border-radius:14px;padding:15px;font-size:16px;outline:0}button{margin-top:10px;padding:11px 15px;border:0;border-radius:10px;background:#b7f3ff;font-weight:700}</style></head><body><h2>AURA Notatnik</h2><textarea id="n" placeholder="Wpisz notatkę..."></textarea><br><button onclick="localStorage.auraNote=n.value">Zapisz</button> <button onclick="n.value='';localStorage.removeItem('auraNote')">Wyczyść</button><script>n.value=localStorage.auraNote||''</script></body></html>
